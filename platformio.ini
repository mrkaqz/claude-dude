[env:lilygo-t-display-s3]
; pioarduino's platform-espressif32 fork, not the official PlatformIO
; registry package — the registry's framework-arduinoespressif32 tool is
; stuck on a Dec-2024 Arduino-ESP32 core that has a known BLE Secure
; Connections pairing bug (auth fails within ~100ms of the passkey being
; generated, fixed upstream 2025-09-11). pioarduino tracks current
; Arduino-ESP32 releases; same board defs and API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Stock default_16MB.csv labels the data partition subtype "spiffs" — this
; core's esp_littlefs component specifically looks for subtype "littlefs"
; and errors ("No data partition with subtype littlefs found") against the
; stock table even though LittleFS is what's actually mounted.
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; TFT_eSPI config for the T-Display-S3 panel, via build_flags so a
    ; .pio wipe or library update can't silently lose the pin map.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_DC=7
    -DTFT_RD=9
    -DTFT_WR=8
    -DTFT_CS=6
    -DTFT_RST=5
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
